name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ipa-build]

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Thunderbird.xcworkspace \
            -scheme Thunderbird

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -workspace Thunderbird.xcworkspace \
            -scheme Thunderbird \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Thunderbird.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | tail -40

      - name: Package IPA
        run: |
          APP=$(ls -d build/Thunderbird.xcarchive/Products/Applications/*.app | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Thunderbird.ipa Payload
          ls -lh Thunderbird.ipa
          unzip -l Thunderbird.ipa | head -15
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-${{ github.run_number }}"
          gh release create "$TAG" Thunderbird.ipa \
            --title "Thunderbird iOS unsigned build ${{ github.run_number }}" \
            --notes "Unsigned build of upstream main at ${GITHUB_SHA::7}. Sign it with your own certificate (Feather) before installing."
